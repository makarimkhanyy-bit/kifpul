<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کیف پول من | داشبورد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#f7f7fb;--cd:#fff;--tx:#2b2d52;--mu:#9a9cb8;--ln:#efeff6;--pu:#7b73fb;--te:#56c8c4;--rd:#f87171;--or:#fbbf24;--tr:#ececf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--cd:#1c1e2e;--tx:#ececf8;--mu:#8e90ad;--ln:#2a2c42;--tr:#2f3250}}
:root[data-theme="dark"]{--bg:#12131c;--cd:#1c1e2e;--tx:#ececf8;--mu:#8e90ad;--ln:#2a2c42;--tr:#2f3250}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px;padding:28px 18px}
.app{max-width:1240px;margin:0 auto;background:var(--cd);border-radius:20px;box-shadow:0 20px 60px rgba(80,80,150,.12);display:grid;grid-template-columns:20% 1fr;overflow:hidden}
aside{border-left:1px solid var(--ln);padding:56px 28px 36px;display:flex;flex-direction:column;min-height:640px}
.logo{font-size:30px;font-weight:800;position:relative;display:inline-block;margin-bottom:46px}
.logo small{position:absolute;top:-12px;right:-6px;font-size:9px;font-weight:400;background:#56c8c41f;color:var(--te);border-radius:10px;padding:0 7px}
nav a{display:flex;align-items:center;gap:12px;padding:13px 4px;font-weight:500;color:var(--tx);text-decoration:none;cursor:pointer}
nav a.on{color:var(--pu)}nav a i svg{display:block}nav a i{font-style:normal;width:20px;text-align:center;font-size:17px}
nav hr{border:0;border-top:1px solid var(--ln);margin:14px 0}
nav a b{margin-right:auto;font-size:11px;font-weight:400;background:#7b73fb1f;color:var(--pu);border-radius:10px;padding:0 9px}
.pro{margin-top:auto;background:var(--pu);color:#fff;border-radius:30px;padding:12px;text-align:center;font-weight:500;box-shadow:0 8px 20px #7b73fb55}
main{padding:44px 48px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.top .r,.top .l{display:flex;align-items:center;gap:14px}
.top h1{font-size:22px;margin:0;font-weight:800}.top .sel{color:var(--mu);margin-right:6px}
.btn{background:var(--te);color:#fff;border:0;border-radius:22px;padding:8px 20px;font:inherit;font-size:13px;cursor:pointer;margin-right:14px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2b2d52,#7b73fb);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.bell{position:relative;font-size:19px;color:var(--rd)}.bell:after{content:"";position:absolute;top:0;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--rd)}
.moon{font-size:20px;color:var(--mu)}
.row1{display:grid;grid-template-columns:515fr 865fr;gap:28px;margin-bottom:26px}
.row2{display:grid;grid-template-columns:310fr 317fr 363fr 277fr;gap:24px;align-items:start}
.card{background:var(--cd);border-radius:14px;padding:18px 20px;box-shadow:0 4px 22px rgba(90,90,150,.08)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-weight:500;font-size:15px}
.hd s{text-decoration:none;color:var(--mu);font-size:13px;letter-spacing:6px}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acc{border-radius:12px;color:#fff;padding:18px 16px 14px;height:210px;position:relative;overflow:hidden}
.acc h3{margin:0;font-size:15px;font-weight:500}.acc p{margin:2px 0;font-size:10px;opacity:.65;direction:ltr;text-align:right}
.acc svg{position:absolute;left:0;right:0;top:70px;width:100%}.acc .v{position:absolute;bottom:14px;right:16px;font-size:14px;font-weight:500}
.chart{direction:ltr;display:flex;align-items:flex-end;justify-content:space-between;height:170px;padding:0 6px;border-bottom:1px solid var(--ln);position:relative;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/100% 33%}
.chart div{width:6px;border-radius:4px;background:var(--te);display:flex;align-items:flex-end;margin-bottom:-1px}
.chart div i{width:100%;border-radius:4px;background:var(--pu);display:block}
.lab{direction:ltr;display:flex;justify-content:space-between;padding:8px 2px 0;color:var(--mu);font-size:12px}.lab span{width:20px;text-align:center}
.bud{display:flex;align-items:center;gap:14px;padding:22px 12px}.bud+.bud{margin-top:14px}
.ring{--p:30;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--pu) calc(var(--p)*1%),var(--tr) 0);display:grid;place-items:center;flex:none}
.ring i{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-size:10px;color:var(--mu)}
.bud h4{margin:0 0 4px;font-weight:500;font-size:15px}.bud span{color:var(--mu);font-size:13px}
.cat{margin-bottom:16px}.cat .t{display:flex;justify-content:space-between;font-size:13px}.cat .t em{font-style:normal;color:var(--mu);font-size:11px}
.cat .b{height:5px;border-radius:4px;background:var(--tr);margin-top:6px;overflow:hidden}.cat .b u{display:block;height:100%;border-radius:4px;margin-right:0}
.pp{display:flex;align-items:center;gap:10px;margin-bottom:18px}.pp .n{flex:1;line-height:1.3;font-size:13px}.pp .n small{display:block;color:var(--mu);font-size:11px}
.pp .m{font-size:11px;display:flex;gap:7px;align-items:center;color:var(--mu)}.pp .m b{color:var(--tx);font-weight:500;font-size:12px}
.tg{font-size:8px;color:#fff;border-radius:8px;padding:0 7px}
.dl{background:linear-gradient(160deg,#3a2fd0,#2a22a8);border-radius:14px;height:150px;color:#fff;position:relative;box-shadow:0 10px 24px #3a2fd055;overflow:hidden}
.dl h3{margin:0;position:absolute;top:14px;right:16px;font-size:14px;font-weight:500}.dl svg{position:absolute;inset:0;width:100%;height:100%}
.chk{margin-top:32px;background:#e8f8f7;border-radius:14px;color:var(--te);display:flex;justify-content:space-between;align-items:center;padding:22px 20px;font-size:15px;font-weight:500}
dialog{border:0;border-radius:16px;padding:20px;background:var(--cd);color:var(--tx);width:min(340px,92vw);font-family:inherit}
dialog::backdrop{background:#0006}dialog input,dialog select{width:100%;font:inherit;padding:9px 11px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
dialog .btn{width:100%;margin:8px 0 0;padding:10px}
@media(max-width:980px){.row1,.row2{grid-template-columns:1fr 1fr}main{padding:24px 16px}}
@media(max-width:640px){.row1,.row2{grid-template-columns:1fr}.top{flex-wrap:wrap;gap:12px}}
.al{border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px}.al.r{background:#f871711f;color:var(--rd)}.al.o{background:#fbbf2426;color:#b7791f}.al.t{background:#56c8c41f;color:#2a9d99}
@media (prefers-color-scheme:dark){.al.o{color:var(--or)}}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.rw:last-child{border:0}.rw small{display:block;color:var(--mu);font-size:11px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;padding:2px 8px}.pill{font-size:10px;background:#7b73fb1f;color:var(--pu);border-radius:9px;padding:0 8px}
.pg{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.pg h2{font-size:17px;margin:0 0 6px;grid-column:1/-1}
dialog label{font-size:12px;color:var(--mu);display:block;margin-top:6px}dialog textarea{width:100%;height:110px;font:11px monospace;direction:ltr;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px}
nav a,.pro,.dl,.chk,.pp .tg,.hd s,.top .sel{cursor:pointer}
@media(max-width:980px){.app{grid-template-columns:1fr}aside{display:flex;padding:10px 12px;min-height:0;border:0;border-bottom:1px solid var(--ln)}aside .logo,aside .pro,nav hr{display:none}nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;padding:8px 10px}}
#auth{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:16px}#auth[hidden]{display:none}.ab{background:var(--cd);border-radius:18px;padding:26px;width:min(380px,100%);box-shadow:0 20px 60px rgba(80,80,150,.15)}
#auth input{width:100%;font:inherit;padding:10px 12px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:#2b2d52;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;transition:.3s;font-size:13px;opacity:0;pointer-events:none}#toast.show{transform:translateX(-50%);opacity:1}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.qa button{border:0;border-radius:22px;padding:9px 18px;font:inherit;font-size:13px;cursor:pointer;background:#7b73fb1f;color:var(--pu);font-weight:500}
.acc .ab2{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}.acc .ab2 button{border:0;background:#ffffff33;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer;font:inherit;font-size:13px;padding:0}
.qs{display:flex;gap:8px;margin-bottom:14px}.qs input{flex:1;min-width:0;font:inherit;padding:11px 16px;border:1px solid var(--ln);border-radius:22px;background:var(--cd);color:var(--tx)}
.bar2{height:8px;border-radius:5px;background:var(--tr);overflow:hidden;margin:10px 0 4px}.bar2 u{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--te),var(--pu))}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo">کیف پول من<small>رایگان</small></div>
  <nav id="nav"></nav>
  <div class="pro" id="pro">نسخه حرفه‌ای را امتحان کنید</div>
</aside>
<main id="main"></main>
</div>
<dialog id="dg"><form id="fm"></form></dialog>
<div id="auth" hidden><div class="ab"><div id="af"></div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),DAY=864e5;
const fa=n=>Math.round(n).toLocaleString('fa-IR').replace(/٬/g,'/');
const num=s=>parseFloat(String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[,٬،\/\s]/g,''))||0;
const JF=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'});
const jp=d=>{const o={};JF.formatToParts(d).forEach(p=>{if(p.type!=='era')o[p.type]=parseInt(p.value)});return o};
const mk=d=>{const p=jp(d);return p.year+'-'+p.month};
const iso=d=>{const t=new Date(d);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)};
const D=s=>new Date(s+'T12:00:00'),today=()=>D(iso(new Date())),ago=n=>iso(new Date(today().getTime()-n*DAY));
const sd=d=>new Intl.DateTimeFormat('fa-IR',{month:'long',day:'numeric'}).format(d);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=["کافه و رستوران","ورزش و سلامتی","حمل و نقل","اکانت اینترنتی","خرید","قبض","سایر","شارژ موبایل"];
const CCOL=["#56c8c4","#7b73fb","#f87171","#fbbf24","#34d399","#60a5fa","#9a9cb8","#a78bfa"];
const QA=`<div class="qa"><button data-a="buy" data-k="charge">📱 شارژ</button><button data-a="buy" data-k="net">🌐 بسته اینترنت</button><button data-a="buy" data-k="bill">🧾 پرداخت قبض</button></div>`;
const PK=[["۱ گیگ ۷ روزه",30000],["۵ گیگ ماهانه",120000],["۲۰ گیگ ماهانه",320000],["۵۰ گیگ ماهانه",650000]],BT=["برق","گاز","آب","تلفن ثابت","موبایل"];
const NAV=[["home",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`,"خانه"],["out",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3C7.58 3 4 4.34 4 6v2c0 1.66 3.58 3 8 3s8-1.34 8-3V6c0-1.66-3.58-3-8-3zM4 10v3c0 1.66 3.58 3 8 3s8-1.34 8-3v-3c0 1.66-3.58 3-8 3s-8-1.34-8-3zm0 5v3c0 1.66 3.58 3 8 3s8-1.34 8-3v-3c0 1.66-3.58 3-8 3s-8-1.34-8-3z"/></svg>`,"برداشت ها"],["in",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>`,"واریز ها"],["acc",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 7H5a1 1 0 0 1 0-2h14V3H5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zm-3 8.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>`,"حساب ها"],["buy",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2v2h2l3.6 7.59-1.35 2.45A2 2 0 0 0 7 17h12v-2H7.42l.93-1.7h7.45a2 2 0 0 0 1.75-1.03l3.58-6.49A1 1 0 0 0 20.25 4H5.21l-.94-2H1zm16 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>`,"شارژ، نت و قبض"],["goal",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/></svg>`,"هدف‌ها"],["rep",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11 2v9h9a9 9 0 0 0-9-9zM9 4.06A9 9 0 1 0 19.94 13H9V4.06z"/></svg>`,"گزارش گیری"],["ppl",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05A4.2 4.2 0 0 1 17 16.5V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,"اشخاص"],["set",`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94c0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.7 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94L2.82 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>`,"تنظیمات"]];
let S,view='home',AU=null,AUTH={users:[],cur:null},AM='login';
const dg=s=>String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/\D/g,'');
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(window._tt);window._tt=setTimeout(()=>t.className='',3200)};
const NAME=()=>AU?AU.name:'';
const blank=()=>({acc:[{id:1,name:"بانک سامان",num:"۵۰۲۲-۲۹۱۰-۷۰۵۶-۵۹۸۹",b0:5000000},{id:2,name:"بانک پاسارگاد",num:"۵۰۲۲-۲۹۱۰-۷۰۵۶-۵۹۸۹",b0:7000000}],tx:[],ppl:[],chk:[],bw:2000000,bm:8000000,lim:[2000000,1500000,1000000,1500000,2000000,1000000,1000000,500000]});
function demo(){const s=blank(),t=(ty,a,c,ti,n,ac)=>s.tx.push({id:Math.random(),ty,a,c,ti,d:ago(n),ac:ac||1});
 t('in',9000000,6,'حقوق',3);t('in',3000000,6,'پروژه',12,2);
 [0,30,60].forEach(n=>t('out',590000,3,'اشتراک اینترنت',n));[1,30,59].forEach(n=>t('out',800000,1,'باشگاه',n+1,2));
 t('out',650000,0,'کافه',1);t('out',420000,0,'رستوران',5);t('out',180000,2,'اسنپ',2);t('out',240000,2,'اسنپ',6);t('out',1900000,4,'خرید هفتگی',3);t('out',350000,1,'دارو',8);t('out',900000,5,'قبض برق و گاز',9);t('out',560000,0,'کافه',14);t('out',1200000,4,'لباس',16);
 s.ppl=[{id:1,n:"پارسا صادقی",a:400000,debt:1},{id:2,n:"سام مظفری",a:800000,debt:0},{id:3,n:"مهران کرامتی",a:50000,debt:1},{id:4,n:"آرزو برومند",a:130000,debt:1}];
 s.chk=[{id:1,t:"قسط",a:1500000,d:ago(-3)}];return s;}
try{AUTH=JSON.parse(localStorage.getItem('kp_auth'))||AUTH}catch(e){}
const saveAuth=()=>{try{localStorage.setItem('kp_auth',JSON.stringify(AUTH))}catch(e){}};
const save=()=>{if(AU)try{localStorage.setItem('kp4_'+AU.id,JSON.stringify(S))}catch(e){}};
function loadUser(){AU=AUTH.users.find(u=>u.id===AUTH.cur)||null;S=blank();S.acc.forEach(a=>a.b0=0);if(!AU)return;
 try{const r=localStorage.getItem('kp4_'+AU.id);if(r)S=JSON.parse(r)}catch(e){}
 while(S.lim.length<CATS.length)S.lim.push(1000000);S.goals=S.goals||[];}
const sha=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function showAuth(){$('#auth').hidden=false;const su=AM==='up',off='background:var(--tr);color:var(--tx);';
 $('#af').innerHTML=`<div class="logo" style="margin-bottom:16px;font-size:26px">کیف پول من</div><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" style="margin:0;flex:1;${su?off:''}" data-a="am" data-m="in">ورود</button><button class="btn" style="margin:0;flex:1;${su?'':off}" data-a="am" data-m="up">ثبت نام</button></div><form id="auf">${su?'<input id="un" placeholder="نام و نام خانوادگی" required>':''}<input id="up" inputmode="numeric" placeholder="شماره موبایل (۰۹…)" required><input id="pw" type="password" inputmode="numeric" placeholder="رمز ۴ تا ۶ رقمی" required><button class="btn" style="margin:8px 0 0;width:100%;padding:11px">${su?'ساخت حساب':'ورود'}</button></form><p style="font-size:11px;color:var(--mu)">اطلاعات فقط روی همین دستگاه ذخیره می‌شود و رمز قابل بازیابی نیست.</p>`;
 $('#auf').onsubmit=async e=>{e.preventDefault();const ph=dg($('#up').value),pw=dg($('#pw').value);
  if(!/^09\d{9}$/.test(ph))return toast('شماره موبایل معتبر نیست');
  if(pw.length<4||pw.length>6)return toast('رمز باید ۴ تا ۶ رقم باشد');
  if(su){if(AUTH.users.some(u=>u.ph===ph))return toast('این شماره قبلاً ثبت شده؛ وارد شوید');
   const salt=Math.random().toString(36).slice(2),u={id:Date.now(),name:$('#un').value.trim()||'کاربر',ph,salt,h:await sha(salt+pw)};
   const first=!AUTH.users.length;AUTH.users.push(u);AUTH.cur=u.id;saveAuth();
   try{const o=first&&localStorage.getItem('kp4');if(o)localStorage.setItem('kp4_'+u.id,o)}catch(x){}
